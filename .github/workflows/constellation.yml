# THE OBSERVER'S CONSTELLATION
# Automatically generate our little galaxy!

name: Observer's Constellation

on:
  workflow_dispatch:

  schedule:
    - cron: "17 0 * * *"

permissions:
  contents: write

jobs:
  generate-stars:
    runs-on: ubuntu-latest

    steps:
      - name: Get repository files
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate constellation
        run: python scripts/constellation.py

      - name: Save constellation to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add assets/constellation.svg

          if ! git diff --cached --quiet; then
            git commit -m "Update observer constellation"
            git push
          fi
